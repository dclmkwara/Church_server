site_name: DCLM Church Management System
site_description: Complete documentation for the Deeper Life Church Management System backend API
site_author: DCLM Development Team
site_url: https://docs.dclm.org

# The repository README and docs/index.md are separate landing pages. Do not
# let MkDocs treat README.md as a second implicit index page.
exclude_docs: |
  README.md

repo_name: dclm/backend
repo_url: https://github.com/your-org/dclm-backend

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Overview: OVERVIEW.md
  - Features: FEATURES.md
  - Limitations: LIMITATIONS.md
  - Maintainers: MAINTAINERS.md
  - Frontend Planning:
      - Route/API Permission Matrix: FRONTEND_ROUTE_API_PERMISSION_MATRIX.md
      - Phase 7 Pilot Acceptance: PHASE7_PILOT_ACCEPTANCE.md
  - Non-Technical:
      - Guide: NON_TECHNICAL_GUIDE.md
      - Quickstart: NON_TECHNICAL_QUICKSTART.md
      - Glossary: GLOSSARY_PLAIN.md
  - Getting Started:
      - Quick Start: QUICK_START.md
      - Setup Guide: SETUP.md
      - Deployment: DEPLOYMENT.md
  - Architecture:
      - System Overview: COMPREHENSIVE_ANALYSIS.md
      - Architecture: ARCHITECTURE.md
      - Scaling Decision: SCALING_DECISION.md
      - Hierarchy Diagram: HIERARCHY_DIAGRAM.md
      - Database Schema: DATABASE_SCHEMA.md
      - Security & Access Control: SECURITY.md
      - Data Flow: DATA_FLOW.md
      - Data Flow Diagrams: DATA_FLOW_DIAGRAMS.md
      - Advanced Data Flows: ADVANCED_DATA_FLOWS.md
      - More Diagrams: MORE_DIAGRAMS.md
      - Extra Diagrams: EXTRA_DIAGRAMS.md
      - Data Governance: DATA_GOVERNANCE.md
  - API Reference:
      - Complete API Docs: API_DOCUMENTATION.md
      - Authentication: AUTHENTICATION.md
      - Route Catalog: ROUTE_CATALOG.md
      - Route Details: ROUTE_DETAILS.md
      - Permissions Matrix: PERMISSIONS_MATRIX.md
      - Missing Routes: MISSING_ROUTES_ANALYSIS.md
  - Admin Tools:
      - Permissions Seed: PERMISSIONS_SEED.md
      - Role Scores Seed: ROLE_SCORES_SEED.md
  - Quick Reference: QUICK_REFERENCE.md
  - Development:
      - Tech Stack: TECH_STACK.md
      - Testing Guide: TESTING.md
      - Cleanup Guide: CLEANUP_GUIDE.md
  - Features:
      - User Management: features/USER_MANAGEMENT.md
      - Hierarchy System: features/HIERARCHY.md
      - Data Collection: DATA_FLOW.md
      - Fellowship: mobile/FELLOWSHIP_APP.md
      - Feature Catalog: FEATURES.md
  - Mobile Apps:
      - Usher App: mobile/USHER_APP.md
      - Fellowship App: mobile/FELLOWSHIP_APP.md
      - Admin App: mobile/ADMIN_APP.md
  - Public Website:
      - Website Features: website/PUBLIC_SITE.md
      - Design System: website/DESIGN_SYSTEM.md
  - Reference:
      - Migration Guide: MIGRATION_GUIDE.md
      - Feature Comparison: FEATURE_COMPARISON.md
      - Glossary: GLOSSARY.md
      - FAQ: FAQ.md
      - Troubleshooting: TROUBLESHOOTING.md

plugins:
  - search
  - tags

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-org/dclm-backend
    - icon: fontawesome/solid/envelope
      link: mailto:support@dclm.org

copyright: Copyright &copy; 2026 Deeper Life Church Management System
