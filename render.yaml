databases:
  - name: dclm-db
    plan: free
    databaseName: dclm_db
    user: dclm_admin
    postgresMajorVersion: "16"

services:
  - type: web
    name: dclm-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: "DCLM Server"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: DATABASE_URL
        fromDatabase:
          name: dclm-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.0"
