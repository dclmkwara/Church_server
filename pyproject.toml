[project]
name = "church-server"
version = "1.3.0"
description = "DCLM church operations FastAPI backend"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic",
    "bcrypt",
    "email-validator",
    "fastapi[standard]",
    "httpx>=0.27.0",
    "Jinja2",
    "passlib",
    "pillow",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "python-jose[cryptography]",
    "python-multipart",
    "SQLAlchemy>=2.0.0",
    "uvicorn[standard]",
    "websockets",
    "qrcode",
    "asyncpg",
    "psycopg2-binary",
    "APScheduler>=3.10.0",
    "openpyxl>=3.1.0",
    "reportlab",
    "python-fasthtml>=0.6.0",
    "faststrap>=0.8.0",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "alembic*"]

[tool.setuptools.package-data]
"*" = ["*.css", "*.js", "*.png", "*.ico", "*.svg", "*.html", "*.json", "*.ini", "*.sql"]

[tool.fastapi]
entrypoint = "app.main:app"
